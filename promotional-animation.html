<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcadShield - 可信毕设评审系统</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;height:100%;overflow:hidden;
  background:#0A0F1E;
  font-family:'Inter',sans-serif;
}

.stage{
  width:100%;height:100%;position:relative;
  background:#0A0F1E;
  overflow:hidden;
}

/* ===== 全局粒子背景 ===== */
.particles{
  position:absolute;inset:0;pointer-events:none;z-index:0;
}
.particle{
  position:absolute;border-radius:50%;
  background:rgba(30,58,138,0.15);
  animation:particleFloat 20s infinite ease-in-out;
}
@keyframes particleFloat{
  0%,100%{transform:translateY(0) scale(1);opacity:0.15}
  50%{transform:translateY(-40px) scale(1.1);opacity:0.3}
}

/* ===== Scene 1: 品牌入场 ===== */
.scene-brand{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:10;
  opacity:0;
}
.shield-icon{
  font-family:'Noto Serif SC',serif;font-size:140px;font-weight:900;
  color:#F5F1E8;line-height:1;
  text-shadow:0 0 60px rgba(30,58,138,0.5),0 0 120px rgba(30,58,138,0.2);
}
.brand-title{
  font-family:'Noto Serif SC',serif;font-size:56px;font-weight:700;
  color:#F5F1E8;letter-spacing:0.05em;margin-top:20px;
  opacity:0;
}
.brand-line{
  width:0;height:2px;background:linear-gradient(90deg,transparent,#1E3A8A,transparent);
  margin:24px auto;
}
.brand-subtitle{
  font-size:20px;color:#64748B;letter-spacing:0.1em;
  font-weight:300;opacity:0;
}

/* ===== Scene 2: 痛点展示 ===== */
.scene-pain{
  position:absolute;inset:0;z-index:10;opacity:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.pain-header{
  font-family:'Noto Serif SC',serif;font-size:36px;font-weight:700;
  color:#F5F1E8;margin-bottom:60px;opacity:0;
}
.pain-items{
  display:flex;gap:40px;
}
.pain-item{
  width:280px;padding:40px 30px;
  background:rgba(15,23,42,0.8);
  border:1px solid rgba(239,68,68,0.2);
  border-radius:12px;text-align:center;
  opacity:0;transform:translateY(30px);
}
.pain-icon{
  font-size:48px;margin-bottom:20px;
  filter:grayscale(0.3);
}
.pain-title{
  font-family:'Noto Serif SC',serif;font-size:20px;font-weight:600;
  color:#FEE2E2;margin-bottom:12px;
}
.pain-desc{
  font-size:14px;color:#94A3B8;line-height:1.6;
}
.pain-cross{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:200px;color:rgba(239,68,68,0.08);
  font-weight:900;pointer-events:none;
  opacity:0;
}

/* ===== Scene 3: 解决方案 ===== */
.scene-solution{
  position:absolute;inset:0;z-index:10;opacity:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.solution-header{
  font-family:'Noto Serif SC',serif;font-size:36px;font-weight:700;
  color:#F5F1E8;margin-bottom:60px;opacity:0;
}
.solution-cards{
  display:flex;gap:30px;
}
.solution-card{
  width:300px;padding:40px 30px;
  background:linear-gradient(135deg,rgba(30,58,138,0.15),rgba(15,23,42,0.6));
  border:1px solid rgba(30,58,138,0.3);
  border-radius:12px;text-align:center;
  opacity:0;transform:translateY(30px);
  position:relative;overflow:hidden;
}
.solution-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#1E3A8A,#3B82F6);
}
.solution-icon{
  font-size:40px;margin-bottom:20px;
}
.solution-title{
  font-family:'Noto Serif SC',serif;font-size:20px;font-weight:600;
  color:#DBEAFE;margin-bottom:12px;
}
.solution-desc{
  font-size:14px;color:#94A3B8;line-height:1.6;
}

/* ===== Scene 4: 工作流程 ===== */
.scene-workflow{
  position:absolute;inset:0;z-index:10;opacity:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.workflow-header{
  font-family:'Noto Serif SC',serif;font-size:36px;font-weight:700;
  color:#F5F1E8;margin-bottom:60px;opacity:0;
}
.workflow-steps{
  display:flex;align-items:center;gap:20px;
}
.workflow-step{
  display:flex;flex-direction:column;align-items:center;
  opacity:0;transform:translateY(30px);
}
.step-circle{
  width:80px;height:80px;border-radius:50%;
  background:linear-gradient(135deg,#1E3A8A,#3B82F6);
  display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif SC',serif;font-size:32px;font-weight:700;
  color:#F5F1E8;margin-bottom:16px;
  box-shadow:0 0 30px rgba(30,58,138,0.4);
}
.step-label{
  font-family:'Noto Serif SC',serif;font-size:18px;font-weight:600;
  color:#F5F1E8;margin-bottom:8px;
}
.step-func{
  font-family:'JetBrains Mono',monospace;font-size:11px;
  color:#3B82F6;background:rgba(30,58,138,0.2);
  padding:4px 10px;border-radius:4px;
  max-width:200px;text-align:center;
}
.workflow-arrow{
  font-size:28px;color:#3B82F6;opacity:0;
}

/* ===== Scene 5: 架构展示 ===== */
.scene-arch{
  position:absolute;inset:0;z-index:10;opacity:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.arch-header{
  font-family:'Noto Serif SC',serif;font-size:36px;font-weight:700;
  color:#F5F1E8;margin-bottom:50px;opacity:0;
}
.arch-layers{
  display:flex;flex-direction:column;gap:16px;width:600px;
}
.arch-layer{
  padding:20px 30px;border-radius:10px;
  opacity:0;transform:translateX(-30px);
  display:flex;align-items:center;gap:20px;
}

  background:linear-gradient(90deg,rgba(59,130,246,0.
